name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt runtime library on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install offline test and build dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install package without AI runtimes
        run: python -m pip install --no-deps -e .
      - name: Lint source and scripts
        run: python -m ruff check src scripts
      - name: Check Python formatting
        run: python -m ruff format --check src scripts tests
      - name: Create test working directory
        run: python -c "from pathlib import Path; Path('work').mkdir(exist_ok=True)"
      - name: Run offline tests
        run: python -B -m pytest -q -p no:cacheprovider --basetemp=work/ci-tests
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check source release contents
        run: python scripts/check_release.py
