<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study RAG</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">LOCAL PDF STUDY ASSISTANT</p>
          <h1>Study from your own notes.</h1>
          <p>Put PDFs in the <code>documents</code> folder, then ask a question.</p>
        </div>
        <button id="reindex">Reindex folder</button>
      </header>

      <section class="status-card">
        <div><span id="dot"></span><strong id="state">Starting</strong></div>
        <p id="summary">Reading your documents…</p>
        <div id="documents" class="documents"></div>
      </section>

      <form id="question-form">
        <label for="question">What should I explain?</label>
        <div class="question-row">
          <input id="question" maxlength="500" placeholder="e.g. What is algorithmic bias?" required />
          <button type="submit">Explain</button>
        </div>
      </form>

      <p id="error" class="error" hidden></p>
      <section id="answer-card" class="answer-card" hidden>
        <h2>Explanation</h2>
        <div id="answer" class="answer"></div>
        <h3>Sources</h3>
        <div id="sources"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
